[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-models"
version = "0.1.0"
description = "Leakage-safe spatial house-price training and deployment tools"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pricemodel*", "spatial*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
