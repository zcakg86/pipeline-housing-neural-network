<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seattle Real Estate Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           display: flex; height: 100vh; overflow: hidden; background: #1a1a2e; color: #eee; }
    #sidebar {
      width: 300px; min-width: 300px; background: #16213e;
      padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      border-right: 1px solid #0f3460; font-size: 13px;
    }
    h2 { font-size: 14px; color: #e94560; letter-spacing: 0.5px; margin: 0; }
    label { font-size: 11px; color: #aaa; display: block; margin-bottom: 3px; }
    select, input[type=date] {
      width: 100%; background: #0f3460; color: #eee;
      border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font-size: 12px;
    }
    input[type=range] { width: 100%; accent-color: #e94560; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row input[type=checkbox] { width: auto; accent-color: #e94560; }
    .divider { border-top: 1px solid #0f3460; }
    .val { color: #e94560; font-weight: 600; }
    #stats { font-size: 11px; line-height: 1.9; color: #ccc; }
    #stats b { color: #e94560; }
    #fetchStatus { font-size: 11px; color: #aaa; min-height: 28px; line-height: 1.5; }
    button {
      width: 100%; padding: 6px; background: #0f3460; color: #eee;
      border: 1px solid #e94560; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #1a3a6e; }
    #map { flex: 1; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.7; min-width: 220px; }
    .leaflet-popup-content a { color: #4a9eff; }

    /* ── Performance popup ── */
    #perfPopup {
      display: block; visibility: hidden; position: fixed; z-index: 9999;
      background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      width: 720px; min-height: 420px; padding: 16px;
      top: 80px; left: 50%; transform: translateX(-50%);
    }
    #perfPopup .popup-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; cursor: move; user-select: none;
    }
    #perfPopup .popup-header h3 { color: #e94560; font-size: 14px; margin: 0; }
    #perfPopup .close-btn {
      background: none; border: none; color: #aaa; font-size: 18px;
      cursor: pointer; padding: 0 4px; width: auto;
    }
    #perfPopup .close-btn:hover { color: #fff; background: none; }
    #chartContainer { position: relative; height: 340px; }
  </style>
</head>
<body>
<div id="sidebar">
  <h2>🏠 Seattle Real Estate</h2>

  <!-- Layer toggles -->
  <div class="divider"></div>
  <div class="row"><input type="checkbox" id="showZillow" checked/><label style="margin:0" for="showZillow">Zillow Listings <span style="color:#3399ff">●</span></label></div>
  <div class="row"><input type="checkbox" id="showRentcast" checked/><label style="margin:0" for="showRentcast">Sales Points <span style="color:#00cc66">●</span></label></div>
  <div style="padding-left:20px">
    <label style="margin-bottom:2px">Point source</label>
    <select id="salesPointSource">
      <option value="rentcast">RentCast only</option>
      <option value="sales">Historical sales only</option>
      <option value="all">RentCast + Historical</option>
    </select>
  </div>
  <div class="row"><input type="checkbox" id="showSales"  checked/><label style="margin:0" for="showSales">H3 Sales Layer</label></div>
  <div class="row"><input type="checkbox" id="showHeat"/><label style="margin:0" for="showHeat">Error Heatmap (replaces H3 layer)</label></div>
  <div class="row"><input type="checkbox" id="showCommunity"/><label style="margin:0" for="showCommunity">Community Layer</label></div>

  <!-- Sales variable -->
  <div class="divider"></div>
  <label>Sales Layer Variable</label>
  <select id="variable">
    <option value="pct_error">Avg Error (%)</option>
    <option value="sale_price">Avg Sale Price</option>
    <option value="sqft">Avg Sqft</option>
    <option value="num_sales">Number of Sales</option>
    <option value="pred_std">Prediction Uncertainty ($)</option>
    <option value="pred_cv_pct">Prediction Uncertainty (% of price)</option>
    <option value="attn_community">Attention — Community</option>
    <option value="attn_year">Attention — Year</option>
    <option value="attn_week">Attention — Week</option>
    <option value="attn_property">Attention — Property</option>
    <option value="attn_time">Attention — Time Trend</option>
    <option value="attn_market">Attention — Market</option>
  </select>

  <!-- Property type filters -->
  <div class="divider"></div>
  <label>Zillow Property Type</label>
  <select id="zillowType"><option value="all">All Types</option></select>

  <label>Sales Property Type</label>
  <select id="salesType"><option value="all">All Types</option></select>

  <!-- Date range for sales -->
  <label>Sales Date Range</label>
  <div style="display:flex;gap:6px">
    <input type="date" id="dateFrom" style="flex:1"/>
    <input type="date" id="dateTo"   style="flex:1"/>
  </div>

  <!-- Error filter -->
  <div class="divider"></div>
  <label>Error Filter (%): <span class="val" id="minErrVal">-500</span> to <span class="val" id="maxErrVal">500</span></label>
  <div class="row" style="gap:6px;align-items:center">
    <input type="range" id="minError" min="-500" max="500" value="-500" step="5" style="flex:1"/>
    <label style="margin:0;white-space:nowrap"><input type="checkbox" id="noFilterMin" style="width:auto"/> No min</label>
  </div>
  <div class="row" style="gap:6px;align-items:center">
    <input type="range" id="maxError" min="-500" max="500" value="500"  step="5" style="flex:1"/>
    <label style="margin:0;white-space:nowrap"><input type="checkbox" id="noFilterMax" style="width:auto"/> No max</label>
  </div>

  <!-- Sqft filter -->
  <label>Sqft: <span class="val" id="sqftVal">0 – 10000</span></label>
  <input type="range" id="minSqft" min="0" max="10000" value="0"     step="100"/>
  <input type="range" id="maxSqft" min="0" max="10000" value="10000" step="100"/>

  <!-- Fetch -->
  <div class="divider"></div>
  <h2>Fetch Live Data</h2>
  <button onclick="fetchApi('rentcast')">↓ Fetch RentCast API</button>
  <button onclick="fetchApi('zillow')">↓ Fetch Zillow API</button>
  <div id="fetchStatus"></div>

  <!-- Stats -->
  <div class="divider"></div>
  <h2>Statistics</h2>
  <div id="stats">Loading...</div>
  <button onclick="openPerfPopup()" style="margin-top:6px">📈 Show Prediction Performance</button>
</div>

<div id="map"></div>

<!-- Performance popup -->
<div id="perfPopup">
  <div class="popup-header" id="perfDragHandle">
    <h3>📈 Prediction Performance by Community</h3>
    <button class="close-btn" onclick="closePerfPopup()">✕</button>
  </div>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px;color:#aaa">
    <label style="margin:0">Y min: <input id="chartYMin" type="number" value="-100" step="10"
      style="width:70px;background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      oninput="updateChartAxes()"/></label>
    <label style="margin:0">Y max: <input id="chartYMax" type="number" value="100" step="10"
      style="width:70px;background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      oninput="updateChartAxes()"/></label>
    <label style="margin:0">From: <select id="chartQFrom"
      style="background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      onchange="updateChartAxes()"></select></label>
    <label style="margin:0">To: <select id="chartQTo"
      style="background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      onchange="updateChartAxes()"></select></label>
    <button onclick="resetChartAxes()" style="width:auto;padding:3px 10px;font-size:11px">Reset</button>
  </div>
  <div id="chartContainer" style="position:relative;height:320px;width:100%"><canvas id="perfChart"></canvas></div>
</div>

<script>
// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([47.61, -122.33], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO', maxZoom: 19
}).addTo(map);

let salesLayer    = L.layerGroup().addTo(map);
let zillowLayer   = L.layerGroup().addTo(map);
let rentcastLayer = L.layerGroup().addTo(map);
let communityLayer = L.layerGroup().addTo(map);
let heatLayer     = null;

// ── Colormaps ─────────────────────────────────────────────────────────────────
const COLORMAPS = {
  YlOrRd: [[255,255,204],[255,237,160],[254,217,118],[254,178,76],[253,141,60],[252,78,42],[227,26,28],[177,0,38]],
  Blues:  [[239,243,255],[198,219,239],[158,202,225],[107,174,214],[66,146,198],[33,113,181],[8,81,156],[8,48,107]]
};

function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

function interpolate(t, palette) {
  const n = palette.length - 1;
  const i = Math.min(Math.floor(t * n), n - 1);
  const f = t * n - i;
  const [r0,g0,b0] = palette[i], [r1,g1,b1] = palette[i+1];
  return `rgb(${lerp(r0,r1,f)},${lerp(g0,g1,f)},${lerp(b0,b1,f)})`;
}

function pct(arr, p) {
  const s = [...arr].sort((a,b)=>a-b);
  return s[Math.floor(p/100*(s.length-1))];
}

// ── Diverging error colour scale ──────────────────────────────────────────────
// Anchors (populated from data each load):
//   p10  → #2166AC  dark blue
//   0    → #e0e0e0  neutral
//   p90  → #B2182B  dark red
// Values outside [p10, p90] are clamped to the anchor colours.
// Sign is preserved: negative = blue side, positive = red side.
const ERROR_PALETTE = {
  darkBlue:    [33,  102, 172],   // #2166AC  ≤ p10
  softBlue:    [67,  162, 202],   // #43a2ca
  neutral:     [224, 224, 224],   // #e0e0e0  zero
  softRed:     [227,  74,  51],   // #e34a33
  darkRed:     [178,  24,  43],   // #B2182B  ≥ p90
};

// Compute percentile anchors from the current set of error values
function computeErrorAnchors(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const p = p => sorted[Math.max(0, Math.floor(p / 100 * (sorted.length - 1)))];
  return { p10: p(10), p90: p(90) };
}

function errorColor(v, anchors) {
  const { p10, p90 } = anchors;
  const { darkBlue, softBlue, neutral, softRed, darkRed } = ERROR_PALETTE;

  if (v <= 0) {
    // Blue side: p10 (or below) → neutral (0)
    const lo = Math.min(p10, 0);   // never let lo > 0
    if (lo >= 0 || v <= lo) return `rgb(${darkBlue.join(',')})`;
    const t = (v - lo) / (0 - lo);   // 0 at lo, 1 at 0
    // t=0 → darkBlue, t=0.5 → softBlue, t=1 → neutral
    if (t < 0.5) {
      const s = t * 2;
      return `rgb(${lerp(darkBlue[0],softBlue[0],s)},${lerp(darkBlue[1],softBlue[1],s)},${lerp(darkBlue[2],softBlue[2],s)})`;
    } else {
      const s = (t - 0.5) * 2;
      return `rgb(${lerp(softBlue[0],neutral[0],s)},${lerp(softBlue[1],neutral[1],s)},${lerp(softBlue[2],neutral[2],s)})`;
    }
  } else {
    // Red side: neutral (0) → p90 (or above)
    const hi = Math.max(p90, 0);
    if (hi <= 0 || v >= hi) return `rgb(${darkRed.join(',')})`;
    const t = v / hi;   // 0 at 0, 1 at hi
    // t=0 → neutral, t=0.5 → softRed, t=1 → darkRed
    if (t < 0.5) {
      const s = t * 2;
      return `rgb(${lerp(neutral[0],softRed[0],s)},${lerp(neutral[1],softRed[1],s)},${lerp(neutral[2],softRed[2],s)})`;
    } else {
      const s = (t - 0.5) * 2;
      return `rgb(${lerp(softRed[0],darkRed[0],s)},${lerp(softRed[1],darkRed[1],s)},${lerp(softRed[2],darkRed[2],s)})`;
    }
  }
}

function getErrorRange() {
  const noMin = document.getElementById('noFilterMin').checked;
  const noMax = document.getElementById('noFilterMax').checked;
  return {
    min: noMin ? -99999 : parseInt(document.getElementById('minError').value),
    max: noMax ?  99999 : parseInt(document.getElementById('maxError').value)
  };
}
function getColorFn(variable, values, anchors) {
  if (variable === 'pct_error') return v => errorColor(v, anchors);
  const lo = pct(values, 5), hi = pct(values, 95), range = hi - lo || 1;
  // Attention weights and uncertainty use sequential palettes
  const palette = (variable === 'sqft' || variable === 'pred_std' || variable === 'pred_cv_pct')
    ? COLORMAPS.Blues
    : COLORMAPS.YlOrRd;
  return v => interpolate(Math.max(0, Math.min(1, (v - lo) / range)), palette);
}

// ── Legend ────────────────────────────────────────────────────────────────────
let legendControl = null;

function buildLegend(variable, values, anchors) {
  if (legendControl) map.removeControl(legendControl);
  legendControl = L.control({ position: 'bottomright' });
  legendControl.onAdd = () => {
    const div = L.DomUtil.create('div');
    div.style.cssText = 'background:rgba(22,33,62,0.93);padding:10px 14px;border-radius:6px;' +
      'border:1px solid #0f3460;color:#eee;font-size:12px;min-width:155px;line-height:1.6';
    const titles = {
      pct_error:       'Avg Error (%)',
      sale_price:      'Avg Sale Price',
      sqft:            'Avg Sqft',
      num_sales:       '# Sales',
      pred_std:        'Prediction Uncertainty ($)',
      pred_cv_pct:     'Uncertainty (% of price)',
      attn_community:  'Attention — Community',
      attn_year:       'Attention — Year',
      attn_week:       'Attention — Week',
      attn_property:   'Attention — Property',
      attn_time:       'Attention — Time Trend',
      attn_market:     'Attention — Market',
    };
    div.innerHTML = `<b style="color:#e94560">${titles[variable]||variable}</b><br>`;

    const swatch = (color, label) =>
      `<div style="display:flex;align-items:center;gap:6px;margin:1px 0">
        <span style="display:inline-block;width:16px;height:11px;background:${color};border-radius:2px;flex-shrink:0"></span>
        <span>${label}</span></div>`;

    if (variable === 'pct_error') {
      const { p10, p90 } = anchors;
      // Show: ≤p10, midpoint-neg, 0, midpoint-pos, ≥p90
      const steps = [
        { v: p10,        label: `≤${p10.toFixed(1)}%` },
        { v: p10 / 2,    label: `${(p10/2).toFixed(1)}%` },
        { v: 0,          label: '0%' },
        { v: p90 / 2,    label: `+${(p90/2).toFixed(1)}%` },
        { v: p90,        label: `≥+${p90.toFixed(1)}%` },
      ];
      steps.forEach(({ v, label }) => {
        div.innerHTML += swatch(errorColor(v, anchors), label);
      });
      div.innerHTML += `<div style="font-size:10px;color:#888;margin-top:3px">10th–90th pctile anchors</div>`;
    } else {
      const lo = pct(values,5), hi = pct(values,95);
      const palette = (variable === 'sqft' || variable === 'pred_std' || variable === 'pred_cv_pct')
        ? COLORMAPS.Blues : COLORMAPS.YlOrRd;
      const isAttn = variable.startsWith('attn_');
      const fmt = variable === 'sale_price'
        ? v => '$' + Math.round(v).toLocaleString()
        : variable === 'pred_std'
        ? v => '$' + Math.round(v).toLocaleString()
        : variable === 'pred_cv_pct'
        ? v => v.toFixed(1) + '%'
        : isAttn
        ? v => (v * 100).toFixed(1) + '%'
        : v => Math.round(v).toLocaleString();
      for (let i = 0; i <= 5; i++) {
        const t = i/5;
        div.innerHTML += swatch(interpolate(t, palette), fmt(lo + t*(hi-lo)));
      }
      div.innerHTML += `<div style="font-size:10px;color:#888;margin-top:3px">5th–95th pctile</div>`;
    }
    return div;
  };
  legendControl.addTo(map);
}

// ── Sales H3 layer ────────────────────────────────────────────────────────────
async function loadSales() {
  // Always clear both layers first
  salesLayer.clearLayers();
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  if (legendControl) { map.removeControl(legendControl); legendControl = null; }

  const variable  = document.getElementById('variable').value;
  const {min: minErr, max: maxErr} = getErrorRange();
  const homeType  = document.getElementById('salesType').value;
  const dateFrom  = document.getElementById('dateFrom').value;
  const dateTo    = document.getElementById('dateTo').value;
  const showHeat  = document.getElementById('showHeat').checked;
  const showSales = document.getElementById('showSales').checked;

  // Nothing to show
  if (!showHeat && !showSales) return;

  if (showHeat) {
    // Heatmap mode — fetch raw points
    const res = await fetch(`/api/sales/points?homeType=${homeType}&dateFrom=${dateFrom}&dateTo=${dateTo}&minError=${minErr}&maxError=${maxErr}`);
    const gj  = await res.json();
    const pts  = (gj.features || []).map(f => {
      const e = f.properties.pctError;
      const t = Math.min(Math.abs(e) / 100, 1);
      return [f.geometry.coordinates[1], f.geometry.coordinates[0], t];
    });
    console.log(`Heatmap: ${pts.length} points from /api/sales/points`);
    if (!L.heatLayer) {
      console.error('leaflet.heat not loaded');
      document.getElementById('fetchStatus').textContent = '✗ Heatmap library failed to load, check console';
      return;
    }
    if (pts.length) {
      heatLayer = L.heatLayer(pts, {
        radius: 20, blur: 15, maxZoom: 14, minOpacity: 0.2,
        gradient: { 0.0: 'rgba(224,224,224,0.5)', 0.35: 'rgba(67,162,202,0.5)', 0.5: 'rgba(33,102,172,0.5)', 0.65: 'rgba(227,74,51,0.5)', 1.0: 'rgba(178,24,43,0.5)' }
      }).addTo(map);
    } else {
      console.warn('No points returned for heatmap');
    }
    buildHeatLegend();
    return;  // heatmap is mutually exclusive with H3 layer
  }

  if (!showSales) return;

  const res = await fetch(`/api/sales/h3?variable=${variable}&homeType=${homeType}&dateFrom=${dateFrom}&dateTo=${dateTo}&minError=${minErr}&maxError=${maxErr}`);
  const gj  = await res.json();
  const features = gj.features || [];
  if (!features.length) { if (legendControl) map.removeControl(legendControl); return; }

  const values  = features.map(f => f.properties.displayValue);
  const anchors = variable === 'pct_error' ? computeErrorAnchors(values) : null;
  const colorFn = getColorFn(variable, values, anchors);

  L.geoJSON(gj, {
    style: f => ({ fillColor: colorFn(f.properties.displayValue), fillOpacity: 0.55, color: '#444', weight: 0.5 }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      const attnRow = (label, val) =>
        val != null ? `${label}: ${(val*100).toFixed(1)}%<br>` : '';
      layer.bindPopup(
        `<b>H3 Hex</b>: ${p.h3Index}<br>` +
        `Sales: ${p.numSales}<br>` +
        `Avg Price: $${Math.round(p.avgSalePrice).toLocaleString()}<br>` +
        `Avg Predicted: $${Math.round(p.avgPredictedPrice).toLocaleString()}<br>` +
        `Avg Error: ${p.avgPctError.toFixed(1)}%<br>` +
        `Avg Sqft: ${Math.round(p.avgSqft).toLocaleString()}<br>` +
        `Pred Uncertainty: $${Math.round(p.avgPredStd ?? 0).toLocaleString()} (${(p.avgPredCvPct ?? 0).toFixed(1)}% of price)<br>` +
        `<b>CLS Attention:</b><br>` +
        attnRow('&nbsp; Community', p.attnCommunity) +
        attnRow('&nbsp; Year',      p.attnYear) +
        attnRow('&nbsp; Week',      p.attnWeek) +
        attnRow('&nbsp; Property',  p.attnProperty) +
        attnRow('&nbsp; Time',      p.attnTime) +
        attnRow('&nbsp; Market',    p.attnMarket)
      );
    }
  }).addTo(salesLayer);

  buildLegend(variable, values, anchors);
}

function buildHeatLegend() {
  if (legendControl) map.removeControl(legendControl);
  legendControl = L.control({ position: 'bottomright' });
  legendControl.onAdd = () => {
    const div = L.DomUtil.create('div');
    div.style.cssText = 'background:rgba(22,33,62,0.93);padding:10px 14px;border-radius:6px;' +
      'border:1px solid #0f3460;color:#eee;font-size:12px;min-width:155px';
    div.innerHTML =
      `<b style="color:#e94560">Error Heatmap</b><br>` +
      `<div style="background:linear-gradient(to right,rgba(33,102,172,0.7),rgba(224,224,224,0.7),rgba(178,24,43,0.7));` +
      `height:12px;border-radius:3px;margin:6px 0"></div>` +
      `<div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa">` +
      `<span>− error</span><span>0</span><span>+ error</span></div>` +
      `<div style="font-size:10px;color:#888;margin-top:3px">signed pct error</div>`;
    return div;
  };
  legendControl.addTo(map);
}

// ── Point variable accessor ───────────────────────────────────────────────────
// Maps the variable selector value to the correct per-point property field.
// Attention variables use the attn* fields; pred_std and sqft are direct;
// everything else falls back to pctError.
function pointVariableValue(props, variable) {
  switch (variable) {
    case 'sale_price':      return props.salePrice    ?? props.listPrice ?? 0;
    case 'sqft':            return props.sqft         ?? 0;
    case 'pred_std':        return props.predictionStdPrice ?? 0;
    case 'pred_cv_pct':     return props.predictionCvPct   ?? 0;
    case 'attn_community':  return props.attnCommunity ?? 0;
    case 'attn_year':       return props.attnYear      ?? 0;
    case 'attn_week':       return props.attnWeek      ?? 0;
    case 'attn_property':   return props.attnProperty  ?? 0;
    case 'attn_time':       return props.attnTime      ?? 0;
    case 'attn_market':     return props.attnMarket    ?? 0;
    default:                return props.pctError      ?? 0;
  }
}

// ── Sales points layer (RentCast / historical / both) ────────────────────────
async function loadRentcast() {
  rentcastLayer.clearLayers();
  if (!document.getElementById('showRentcast').checked) return;

  const variable  = document.getElementById('variable').value;
  const {min: minErr, max: maxErr} = getErrorRange();
  const minSqft   = document.getElementById('minSqft').value;
  const maxSqft   = document.getElementById('maxSqft').value;
  const homeType  = document.getElementById('salesType').value;
  const dateFrom  = document.getElementById('dateFrom').value;
  const dateTo    = document.getElementById('dateTo').value;
  const source    = document.getElementById('salesPointSource').value;

  const res = await fetch(
    `/api/rentcast?source=${source}&minError=${minErr}&maxError=${maxErr}` +
    `&minSqft=${minSqft}&maxSqft=${maxSqft}&homeType=${homeType}` +
    `&dateFrom=${dateFrom}&dateTo=${dateTo}`
  );
  const gj = await res.json();
  if (!gj.features || gj.features.length === 0) return;

  // Compute colour function from the loaded data (same approach as H3 layer)
  const values  = gj.features.map(f => pointVariableValue(f.properties, variable));
  const anchors = variable === 'pct_error' ? computeErrorAnchors(values) : null;
  const colorFn = getColorFn(variable, values, anchors);

  L.geoJSON(gj, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius:      6,
      fillColor:   colorFn(pointVariableValue(f.properties, variable)),
      fillOpacity: 0.85,
      color:       '#00cc66',
      weight:      1.5
    }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      const attnRow = (label, val) =>
        (val != null && val !== undefined) ? `${label}: ${(val*100).toFixed(1)}%<br>` : '';
      const srcLabel = p.source === 'sales' ? 'Historical Sale' : 'RentCast Sale';
      layer.bindPopup(
        `<b>${p.address || srcLabel}</b><br>` +
        `<i style="color:#00cc66">${srcLabel}</i><br>` +
        `Sale Price: $${Math.round(p.salePrice).toLocaleString()}<br>` +
        `Predicted: $${Math.round(p.predictedPrice).toLocaleString()}<br>` +
        `Error: ${p.pctError.toFixed(1)}%<br>` +
        `Uncertainty: $${Math.round(p.predictionStdPrice ?? 0).toLocaleString()} (${(p.predictionCvPct ?? 0).toFixed(1)}% of price)<br>` +
        `Beds: ${p.beds} | Baths: ${p.baths} | Sqft: ${Math.round(p.sqft).toLocaleString()}<br>` +
        (p.saleDate ? `Sold: ${p.saleDate}<br>` : '') +
        `<b>CLS Attention:</b><br>` +
        attnRow('&nbsp; Community', p.attnCommunity) +
        attnRow('&nbsp; Year',      p.attnYear) +
        attnRow('&nbsp; Week',      p.attnWeek) +
        attnRow('&nbsp; Property',  p.attnProperty) +
        attnRow('&nbsp; Time',      p.attnTime) +
        attnRow('&nbsp; Market',    p.attnMarket)
      );
    }
  }).addTo(rentcastLayer);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  const res = await fetch('/api/stats');
  const s = await res.json();
  let html = '';
  if (s.zillow) html +=
    `<b>Zillow Listings</b><br>Total: ${s.zillow.total}<br>` +
    `Avg List: $${Math.round(s.zillow.avgListPrice).toLocaleString()}<br>` +
    `Avg Predicted: $${Math.round(s.zillow.avgPredicted).toLocaleString()}<br><br>`;
  if (s.sales) html +=
    `<b>Historical Sales</b><br>Total: ${s.sales.total}<br>` +
    `Unique Hexes: ${s.sales.uniqueHexes}<br>` +
    `Avg Abs Error: ${s.sales.avgAbsError.toFixed(1)}%<br><br>`;

    `<b>Recent Sales</b><br>Total: ${s.rentcast.total}<br>` +
    `Unique Hexes: ${s.rentcast.uniqueHexes}<br>` +
    `Unique Sales: ${s.rentcast.uniqueSales}<br>`+

// ── Populate home type dropdowns ──────────────────────────────────────────────
async function loadHomeTypes() {
  const res = await fetch('/api/home-types');
  const d = await res.json();
  const fill = (id, types) => {
    const sel = document.getElementById(id);
    types.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t.replace(/_/g,' ');

    });

// ── API fetch ─────────────────────────────────────────────────────────────────
async function fetchApi(source) {
  const el = document.getElementById('fetchStatus');
  const statusRes = await fetch('/api/fetch/status');
  const status = await statusRes.json();
  const info = status[source];
  if (info.cooldownActive) {
    el.textContent = `⏳ ${source}: cooldown active, ${info.minutesRemaining} min remaining`;
    return;
  }
  el.textContent = `Fetching ${source}... (billed call)`;
  try {
    const res = await fetch(`/api/fetch/${source}?confirm=true`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      el.textContent = `✓ ${source}: ${data.fetched} records. Next in ${data.nextAllowedIn}`;
      loadHomeTypes(); loadSales(); loadZillow(); loadRentcast(); loadStats();
    } else {
      el.textContent = `✗ ${data.message}`;
    }
  } catch (e) { el.textContent = `✗ ${e.message}`; }
}

// ── Community colormap (10 distinct colours shared by map + chart) ────────────
const COMMUNITY_COLORS = [
  '#e94560','#4a9eff','#00cc66','#ffcc00','#ff6b35',
  '#a855f7','#06b6d4','#f97316','#84cc16','#ec4899'
];
let selectedCommunities = new Set(); // empty = all selected

function communityColor(id, allIds) {
  const i = allIds.indexOf(id);
  return COMMUNITY_COLORS[i % COMMUNITY_COLORS.length];
}

// ── Community map layer ───────────────────────────────────────────────────────
let perfData = null; // cached performance response

async function loadCommunityLayer() {
  communityLayer.clearLayers();
  if (!document.getElementById('showCommunity').checked) return;

  // Ensure perf data loaded so we know the top communities + colors
  if (!perfData) perfData = await (await fetch('/api/performance')).json();
  const topIds = perfData.communities || [];
  if (!topIds.length) return;

  const res = await fetch('/api/sales/community');
  const gj  = await res.json();

  L.geoJSON(gj, {
    style: f => {
      const c = f.properties.community;
      const active = selectedCommunities.size === 0 || selectedCommunities.has(c);
      const color = communityColor(c, topIds);
      return {
        fillColor:   topIds.includes(c) ? color : '#555',
        fillOpacity: active ? 0.45 : 0.1,
        color:       topIds.includes(c) ? color : '#333',
        weight:      0.8
      };
    },
    onEachFeature: (f, layer) => {
      const c = f.properties.community;
      layer.on('click', () => toggleCommunity(c));
      layer.bindTooltip(`Community ${c}`, { sticky: true });
    }
  }).addTo(communityLayer);
}

function toggleCommunity(id) {
  if (selectedCommunities.has(id)) selectedCommunities.delete(id);
  else selectedCommunities.add(id);
  loadCommunityLayer();
  if (perfChart) updateChartSelection();
}

// ── Performance chart popup ───────────────────────────────────────────────────
let perfChart = null;

async function openPerfPopup() {
  const popup = document.getElementById('perfPopup');
  popup.style.visibility = 'visible';
  popup.style.zIndex = '9999';
  if (!perfData) perfData = await (await fetch('/api/performance')).json();
  if (!perfChart) {
    const existing = Chart.getChart('perfChart');
    if (existing) existing.destroy();
    buildChart(perfData);
  }
}

function closePerfPopup() {
  document.getElementById('perfPopup').style.visibility = 'hidden';
}

function buildChart(data) {
  const topIds = data.communities || [];
  const allQuarters = [...new Set(
    data.series.flatMap(s => s.points.map(p => p.quarter))
  )].sort();

  const datasets = [];
  data.series.forEach((s, i) => {
    const color = COMMUNITY_COLORS[i % COMMUNITY_COLORS.length];
    const qMap  = Object.fromEntries(s.points.map(p => [p.quarter, p]));

    // Mean line
    datasets.push({
      label:           `C${s.community}`,
      communityId:     s.community,
      data:            allQuarters.map(q => qMap[q]?.mean ?? null),
      borderColor:     color,
      backgroundColor: color + '33',
      borderWidth:     2,
      pointRadius:     3,
      tension:         0.3,
      spanGaps:        true,
      fill:            false
    });
    // +std dotted
    datasets.push({
      label:       `C${s.community} +σ`,
      communityId: s.community,
      data:        allQuarters.map(q => qMap[q] ? qMap[q].mean + qMap[q].std : null),
      borderColor: color,
      borderWidth: 1,
      borderDash:  [4, 3],
      pointRadius: 0,
      tension:     0.3,
      spanGaps:    true,
      fill:        false
    });
    // -std dotted
    datasets.push({
      label:       `C${s.community} -σ`,
      communityId: s.community,
      data:        allQuarters.map(q => qMap[q] ? qMap[q].mean - qMap[q].std : null),
      borderColor: color,
      borderWidth: 1,
      borderDash:  [4, 3],
      pointRadius: 0,
      tension:     0.3,
      spanGaps:    true,
      fill:        false
    });
  });

  const ctx = document.getElementById('perfChart').getContext('2d');
  perfChart = new Chart(ctx, {
    type: 'line',
    data: { labels: allQuarters, datasets },    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: '#eee', font: { size: 11 },
            filter: (item, chartData) => {
              const ds = chartData.datasets[item.datasetIndex];
              return ds && !ds.label.includes('σ');
            }
          },
          onClick: (e, item, legend) => {
            const ds = legend.chart.data.datasets[item.datasetIndex];
            if (ds && ds.communityId) { toggleCommunity(ds.communityId); updateChartSelection(); }
          }
        },
        tooltip: {
          backgroundColor: '#16213e',
          titleColor: '#e94560',
          bodyColor: '#eee',
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label.includes('σ')) return null;
              return `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#aaa', font: { size: 10 } }, grid: { color: '#1a3a6e' } },
        y: {
          min: -100, max: 100,
          ticks: { color: '#aaa', callback: v => v + '%' },
          grid:  { color: '#1a3a6e' },
          title: { display: true, text: 'Avg % Error', color: '#aaa' }
        }
      }
    }
  });

  // Store all quarters and all data on each dataset for axis filtering
  perfChart._allQuarters = allQuarters;
  datasets.forEach(ds => { ds._allData = [...ds.data]; });

  // Populate quarter dropdowns
  const qFrom = document.getElementById('chartQFrom');
  const qTo   = document.getElementById('chartQTo');
  qFrom.innerHTML = ''; qTo.innerHTML = '';
  allQuarters.forEach(q => {
    qFrom.innerHTML += `<option value="${q}">${q}</option>`;
    qTo.innerHTML   += `<option value="${q}">${q}</option>`;
  });
  qTo.value = allQuarters[allQuarters.length - 1];
}

function updateChartSelection() {
  if (!perfChart) return;
  perfChart.data.datasets.forEach(ds => {
    const active = selectedCommunities.size === 0 || selectedCommunities.has(ds.communityId);
    ds.hidden = !active;
  });
  perfChart.update();
}

function updateChartAxes() {
  if (!perfChart) return;
  const yMin = parseFloat(document.getElementById('chartYMin').value);
  const yMax = parseFloat(document.getElementById('chartYMax').value);
  const qFrom = document.getElementById('chartQFrom').value;
  const qTo   = document.getElementById('chartQTo').value;

  // Y axis
  perfChart.options.scales.y.min = isNaN(yMin) ? undefined : yMin;
  perfChart.options.scales.y.max = isNaN(yMax) ? undefined : yMax;

  // X axis - filter labels and data to selected quarter range
  const allQ = perfChart._allQuarters;
  const fromIdx = allQ.indexOf(qFrom);
  const toIdx   = allQ.indexOf(qTo);
  const filtered = allQ.slice(
    fromIdx >= 0 ? fromIdx : 0,
    toIdx   >= 0 ? toIdx + 1 : allQ.length
  );
  perfChart.data.labels = filtered;
  perfChart.data.datasets.forEach(ds => {
    ds.data = filtered.map(q => {
      const i = allQ.indexOf(q);
      return ds._allData[i];
    });
  });
  perfChart.update();
}

function resetChartAxes() {
  document.getElementById('chartYMin').value = '-100';
  document.getElementById('chartYMax').value = '100';
  if (perfChart) {
    const allQ = perfChart._allQuarters;
    document.getElementById('chartQFrom').value = allQ[0];
    document.getElementById('chartQTo').value   = allQ[allQ.length - 1];
  }
  updateChartAxes();
}

// ── Draggable popup ───────────────────────────────────────────────────────────
(function() {
  const popup = document.getElementById('perfPopup');
  const handle = document.getElementById('perfDragHandle');
  let dragging = false, ox = 0, oy = 0;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    const r = popup.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    popup.style.transform = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    popup.style.left = (e.clientX - ox) + 'px';
    popup.style.top  = (e.clientY - oy) + 'px';
  });
  document.addEventListener('mouseup', () => dragging = false);
})();
