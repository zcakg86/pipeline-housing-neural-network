<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seattle Real Estate Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=transport-events-v2"/>
</head>
<body>
<div id="sidebar">
  <h2>🏠 Seattle Real Estate</h2>

  <!-- Layer toggles -->
  <div class="divider"></div>
  <div class="row"><input type="checkbox" id="showZillow" checked/><label style="margin:0" for="showZillow">Zillow Listings <span style="color:#3399ff">●</span></label></div>
  <div class="row"><input type="checkbox" id="showRentcast"/><label style="margin:0" for="showRentcast">Sales Points <span style="color:#00cc66">●</span></label></div>
  <div style="padding-left:20px">
    <label style="margin-bottom:2px">Point source</label>
    <select id="salesPointSource">
      <option value="rentcast" selected>RentCast (recent) only</option>
      <option value="sales">Historical sales only</option>
      <option value="all" >RentCast + Historical</option>
    </select>
  </div>
  <div class="row"><input type="checkbox" id="showSales"/><label style="margin:0" for="showSales">H3 Sales Layer</label></div>
  <div class="row"><input type="checkbox" id="showCommunity"/><label style="margin:0" for="showCommunity">Community Layer</label></div>
  <div class="row"><input type="checkbox" id="showSynthetic"/><label style="margin:0" for="showSynthetic">Synthetic Layer</label></div>
  <div class="row"><input type="checkbox" id="showWater"/><label style="margin:0" for="showWater">OSM Water &amp; Coastline</label></div>
  <div class="row"><input type="checkbox" id="showRail"/><label style="margin:0" for="showRail">Rail &amp; Light-Rail Stations</label></div>
  <div class="row"><input type="checkbox" id="showBus"/><label style="margin:0" for="showBus">Bus Stations &amp; Routes</label></div>
  <div class="row"><input type="checkbox" id="showMajorRoads"/><label style="margin:0" for="showMajorRoads">Motorways &amp; Major Roads</label></div>
  <div class="row"><input type="checkbox" id="showTransportFeatures"/><label style="margin:0" for="showTransportFeatures">Transport Accessibility (H3)</label></div>
  <div id="transportFeatureControl" style="padding-left:20px;display:none">
    <label style="margin-bottom:2px">Transport map feature</label>
    <select id="transportFeature">
      <option value="light_rail_proximity">Light-rail proximity</option>
      <option value="bus_stop_density_per_sq_km">Bus-stop density</option>
      <option value="nearby_bus_route_count">Distinct nearby bus-route count</option>
      <option value="bus_centrality_score">Bus centrality score</option>
      <option value="motorway_connector_proximity">Motorway-connector proximity</option>
      <option value="major_road_accessibility">Major-road accessibility</option>
      <option value="major_road_density_km_per_sq_km">Major-road density</option>
    </select>
  </div>

  <!-- Sales variable -->
  <div class="divider"></div>
  <button id="communityTrendsButton" onclick="openPerfPopup()" style="display:none;margin-bottom:8px">📈 Community level trends</button>
  <label>Map color</label>
  <select id="variable">
    <option value="pct_error">Price Error (%)</option>
    <option value="predicted_price">Predicted Price</option>
    <option value="sale_price">Sale (or listed) Price</option>
    <option value="sqft">Finished Squared footage</option>
    <option value="sqft_lot">Lot Square Footage</option>
    <option value="pred_std" data-model="neural">Prediction Uncertainty ($)</option>
    <option value="pred_cv_pct" data-model="neural">Prediction Uncertainty (95% CI width)</option>
    <option value="attn_community" data-model="neural">Attention — Community</option>
    <option value="attn_property" data-model="neural">Attention — Property</option>
    <option value="attn_time" data-model="neural">Attention — Time</option>
    <option value="attn_market" data-model="neural">Attention — Market</option>
    <option value="num_sales">Sale count (when aggregated)</option>

  </select>
  <label>Displayed Model</label>
  <select id="DisplayedModel">
    <option value="lightgbm" selected>LightGBM</option>
    <option value="neural">Neural Network</option>
    <option value="gnn">Spatial GNN</option>
  </select>

  <!-- Property type filters -->
  <div class="divider"></div>
  <label>Zillow Property Type</label>
  <select id="zillowType"><option value="all">All Types</option></select>

  <label>Sales Property Type</label>
  <select id="salesType"><option value="all">All Types</option></select>

  <!-- Date range for sales -->
  <label>Sales Date Range</label>
  <div style="display:flex;gap:6px">
    <input type="date" id="dateFrom" style="flex:1"/>
    <input type="date" id="dateTo"   style="flex:1"/>
  </div>

  <!-- Error filter -->
  <div class="divider"></div>
  <label>Error Filter (%): <span class="val" id="minErrVal">-500</span> to <span class="val" id="maxErrVal">500</span></label>
  <div class="row" style="gap:6px;align-items:center">
    <input type="range" id="minError" min="-500" max="500" value="-500" step="5" style="flex:1"/>
    <label style="margin:0;white-space:nowrap"><input type="checkbox" id="noFilterMin" style="width:auto"/> No min</label>
  </div>
  <div class="row" style="gap:6px;align-items:center">
    <input type="range" id="maxError" min="-500" max="500" value="500"  step="5" style="flex:1"/>
    <label style="margin:0;white-space:nowrap"><input type="checkbox" id="noFilterMax" style="width:auto"/> No max</label>
  </div>

  <!-- Sqft filter -->
  <label>Sqft: <span class="val" id="sqftVal">0 – 10000</span></label>
  <input type="range" id="minSqft" min="0" max="10000" value="0"     step="100"/>
  <input type="range" id="maxSqft" min="0" max="10000" value="10000" step="100"/>

  <!-- Fetch -->
  <div class="divider"></div>
  <h2>Fetch Live Data</h2>
  <button onclick="fetchApi('rentcast')">↓ Fetch RentCast API</button>
  <button onclick="fetchApi('zillow')">↓ Fetch Zillow API</button>
  <div id="fetchStatus"></div>

  <!-- Stats -->
  <div class="divider"></div>
  <h2>Statistics</h2>
  <div id="stats">Loading...</div>
</div>

<div id="map"></div>
<div id="mapProgress" aria-live="polite" aria-hidden="true">
  <span id="mapProgressText"></span>
  <div class="map-progress-track"><div id="mapProgressBar"></div></div>
</div>

<!-- Performance popup -->
<div id="perfPopup">
  <div class="popup-header" id="perfDragHandle">
    <h3>📈 Community level trends</h3>
    <button class="close-btn" onclick="closePerfPopup()">✕</button>
  </div>
  <div class="popup-controls">
    <label>Variable
      <select id="chartVariable" onchange="rebuildCommunityTrendChart()">
        <option value="mean_error">Mean signed error (%)</option>
        <option value="mape">Mean absolute error (%)</option>
        <option value="predicted_price">Mean predicted price</option>
        <option value="sale_price">Mean sale price</option>
        <option value="count">Sales count</option>
      </select>
    </label>
    <label>Model
      <select id="chartModel" onchange="rebuildCommunityTrendChart()">
        <option value="lightgbm" selected>LightGBM</option>
        <option value="neural">Neural Network</option>
        <option value="gnn">Spatial GNN</option>
      </select>
    </label>
  </div>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px;color:#aaa">
    <label style="margin:0">Y min: <input id="chartYMin" type="number" value="-100" step="10"
      style="width:70px;background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      oninput="updateChartAxes()"/></label>
    <label style="margin:0">Y max: <input id="chartYMax" type="number" value="100" step="10"
      style="width:70px;background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      oninput="updateChartAxes()"/></label>
    <label style="margin:0">From: <select id="chartQFrom"
      style="background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      onchange="updateChartAxes()"></select></label>
    <label style="margin:0">To: <select id="chartQTo"
      style="background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px"
      onchange="updateChartAxes()"></select></label>
    <button onclick="resetChartAxes()" style="width:auto;padding:3px 10px;font-size:11px">Reset axes</button>
    <button onclick="clearChartCommunities()" style="width:auto;padding:3px 10px;font-size:11px">Clear communities</button>
  </div>
  <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-size:12px;color:#aaa">
    <label style="margin:0;min-width:110px">Communities<br><span style="font-size:10px">⌘/Ctrl-click to toggle</span></label>
    <select id="chartCommunities" multiple size="4"
      style="flex:1;background:#0f3460;color:#eee;border:1px solid #444;border-radius:4px;padding:3px"></select>
  </div>
  <div id="chartContainer"><canvas id="perfChart"></canvas></div>
</div>

<!-- Full synthetic observation explanation popup -->
<div id="featurePopup">
  <div class="popup-header" id="featureDragHandle">
    <h3 id="featurePopupTitle">Synthetic model features</h3>
    <button class="close-btn" onclick="closeFeaturePopup()">✕</button>
  </div>
  <div id="featurePopupBody" class="feature-explanation-scroll"></div>
</div>

<!-- Monthly prediction history for one map property -->
<div id="timeSeriesPopup">
  <div class="popup-header" id="timeSeriesDragHandle">
    <h3 id="timeSeriesPopupTitle">Property value history</h3>
    <button class="close-btn" onclick="closeTimeSeriesPopup()">✕</button>
  </div>
  <div id="timeSeriesNote" class="explanation-note"></div>
  <div id="timeSeriesChartContainer"><canvas id="timeSeriesChart"></canvas></div>
</div>

<script src="js/map.js?v=transport-events-v2"></script>
<script src="js/api.js"></script>
<script src="js/explanations.js"></script>
<script src="js/layers/sales.js"></script>
<script src="js/layers/synthetic.js"></script>
<script src="js/layers/water.js"></script>
<script src="js/layers/transport.js?v=transport-events-v2"></script>
<script src="js/layers/transport-features.js?v=transport-features-v1"></script>
<script src="js/layers/points.js"></script>
<script src="js/charts.js"></script>
<script src="js/time-series.js"></script>
<script src="js/app.js"></script>
</body>
</html>
