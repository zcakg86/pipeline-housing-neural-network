quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.live-reload.instrumentation=true

# Startup baseline uses Python-generated historical features/predictions.
# Re-running Python evaluation refreshes this file without asking the current
# Java local-market snapshot to reconstruct older dates.
data.sales.csv=../../data/sales_2020_25_with_predictions.csv
# Rentcast and Zillow baseline paths removed — use watcher dirs below instead
# data.rentcast.csv=../../data/rentcast_recent_house_sales.csv
# data.zillow.json=../../data/zillow_seattle_listings.json

# File watcher directories (also where API fetches save their output)
watcher.rentcast.dir=data/rentcast
watcher.zillow.dir=data/zillow

# RentCast API
rentcast.api.key=${RENTCAST_API_KEY:${rentcast.api.key.default:}}
rentcast.lat=47.60
# Seattle 47.60 # south of Renton 47.42 
rentcast.lng=-122.33
# Seattle -122.33 # south of Renton -122.19 
rentcast.radius=10
rentcast.months=4
rentcast.limit=500
rentcast.offset=0
rentcast.timeout.seconds=180

# Zillow (HasData) API
zillow.api.key=${ZILLOW_API_KEY:}
zillow.keyword=Kirkland, WA
zillow.type=forSale
zillow.max.pages=20
zillow.delay.ms=2000

# API call cost protection
# Minimum hours between live API calls (set to 0 to disable)
fetch.cooldown.hours=0
fetch.rentcast.cooldown.hours=24
quarkus.log.level=INFO
quarkus.log.category."com.houseprices".level=DEBUG
