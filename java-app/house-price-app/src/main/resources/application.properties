quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.live-reload.instrumentation=true
# lightgbm4j extracts JNI libraries to fixed temporary paths. Keep its classes
# in Quarkus's parent classloader so dev/test reloads do not load the same native
# library from multiple runtime classloaders.
quarkus.class-loading.parent-first-artifacts=io.github.metarank:lightgbm4j
# Carto API key
carto.api.key=${CARTO_API_KEY:${carto.api.key.default:}}

# Grounded Redfin price-assessment agent (Hugging Face Inference Providers)
agent.huggingface.token=${HF_TOKEN:}
agent.huggingface.base-url=https://router.huggingface.co/v1
agent.huggingface.model=${HF_MODEL:openai/gpt-oss-20b}
agent.timeout.seconds=180
agent.listing-page.timeout.seconds=15
agent.evaluation.dir=data/agent-evaluations

# Startup baseline uses Python-generated historical features/predictions.
# Re-running Python evaluation refreshes this file without asking the current
# Java local-market snapshot to reconstruct older dates.
data.sales.csv=../../data/sales_2020_25_with_predictions.csv
# Rentcast and Zillow baseline paths removed — use watcher dirs below instead
# data.rentcast.csv=../../data/rentcast_recent_house_sales.csv
# data.zillow.json=../../data/zillow_seattle_listings.json

# File watcher directories (also where API fetches save their output)
watcher.rentcast.dir=data/rentcast
watcher.zillow.dir=data/zillow
watcher.redfin.dir=data/redfin

# RentCast API
rentcast.api.key=${RENTCAST_API_KEY:${rentcast.api.key.default:}}
rentcast.lat=47.60
# Seattle 47.60 # south of Renton 47.42 
rentcast.lng=-122.33
# Seattle -122.33 # south of Renton -122.19 
rentcast.radius=10
rentcast.months=4
rentcast.limit=500
rentcast.offset=0
rentcast.timeout.seconds=180

# Zillow (HasData) API
zillow.api.key=${ZILLOW_API_KEY:}
zillow.keyword=Kirkland, WA
zillow.type=forSale
zillow.max.pages=20
zillow.delay.ms=2000

# Redfin (HasData) API — shares zillow.api.key / ZILLOW_API_KEY
redfin.keywords=98101,98102,98103,98104,98105,98106,98107,98108,98109,98112,98115,98116,98117,98118,98119,98121,98122,98125,98126,98133,98134,98136,98144,98154,98164,98174,98177,98178,98195,98199,98004,98005,98006,98007,98008,98009,98015,98033,98034,98083,98052,98053,98073,98074
redfin.type=forSale
redfin.sort=newest
redfin.home.types=townhouse,house
redfin.time.on.redfin=
redfin.fetch.all.pages=false
# Per-keyword billing safety cap when all-pages fetching is enabled
redfin.max.pages=20
redfin.delay.ms=2000
redfin.ingestion.lot-size-prefetch.enabled=false
redfin.ingestion.lot-size.concurrency=4

# API call cost protection
# Minimum hours between live API calls (set to 0 to disable)
fetch.cooldown.hours=0
fetch.rentcast.cooldown.hours=24
fetch.redfin.cooldown.hours=0
quarkus.log.level=INFO
quarkus.log.category."com.houseprices".level=DEBUG
