# Python extraction settings; this is no longer a GDAL OSM driver config.
[extract]
boundary_name = King County
admin_level = 6
# Cached buffered King County envelope. This avoids an otherwise redundant
# location-indexed scan of the full Washington PBF on every transport rebuild.
clip_bounds = -122.5931459,47.0340894,-121.0156372,47.8303281
buffer_degrees = 0.05
simplify_degrees = 0.00008

[transport]
major_road_types = motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link
# Both qualifying ways must share an actual OSM node; the node needs no junction tag.
# Paths, footways, cycleways and proposed/construction roads are excluded.
connector_road_types = trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track
