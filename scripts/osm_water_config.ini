# Python extraction settings; this is no longer a GDAL OSM driver config.
[extract]
boundary_name = King County
admin_level = 6
buffer_degrees = 0.05
simplify_degrees = 0.00003

[water]
# Preserve the original natural=water polygon filter, plus coastline ways.
excluded_water_types = stream,drain,ditch,weir
exclude_waterway_tagged = true
