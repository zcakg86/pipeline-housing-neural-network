name: Java App

on:
  push:
    branches: [main]
    paths:
      - 'java-app/**'
      - '.github/workflows/java-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'java-app/**'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: make java-build

      - name: Run (smoke test - start and check health)
        run: |
          make java-run &
          APP_PID=$!
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/stats > /dev/null 2>&1; then
              echo "App is up"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/stats
          kill $APP_PID
